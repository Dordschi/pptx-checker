# CI: проверка проекта на двух системах (Ubuntu и Windows)
# Запускается автоматически при каждом push в GitHub.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить зависимости (requirements.txt)
        run: python -m pip install -r requirements.txt

      - name: Проверить, что все файлы компилируются
        run: python -m py_compile check_presentation.py app_ui.py generate_test_files.py

      - name: Создать эталонные тестовые презентации
        run: python generate_test_files.py

      - name: Самопроверка программы (ожидается PASS 8/8)
        run: python check_presentation.py --test

      - name: Прогнать программу на реальной презентации
        shell: bash
        run: |
          F="отчёт-неделя4/повторение-3-класс-вспоминаем.pptx"
          if [ ! -f "$F" ]; then
            echo "Файла нет в репозитории — шаг пропущен."
            exit 0
          fi
          set +e
          python check_presentation.py "$F" > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          # код 1 = «нашли проблемы» (это успех проверки), 2/3 = поломка
          if [ "$code" -gt 1 ]; then
            echo "Программа упала с ошибкой."
            exit 1
          fi
          grep -q "ИТОГО" out.txt
          echo "OK: отчёт построен, код выхода $code"

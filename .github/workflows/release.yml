# Release: сборка готовых программ при выставлении тега v*
# Выставь тег на GitHub: Tags → Create new tag "v1.0" → publish.
# Соберётся exe для Windows и бинарник для Linux, создастся Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: pptx-checker-windows.exe
          - os: ubuntu-latest
            asset: pptx-checker-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости и PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Собрать программу в один файл
        run: pyinstaller --onefile --name pptx-checker check_presentation.py

      - name: Переименовать под систему
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/pptx-checker.exe "${{ matrix.asset }}"
          else
            mv dist/pptx-checker "${{ matrix.asset }}"
          fi

      - name: Запомнить файл
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Без checkout gh release create не работает — ему нужен git-репозиторий
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Скачать собранные файлы
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Создать Release с файлами
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "pptx-checker $GITHUB_REF_NAME" \
            --generate-notes
